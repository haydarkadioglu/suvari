[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "suvari"
version = "0.1.0"
description = "AI-powered black-box web pentester exposing Kali tools as MCP tools."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.9",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "mcp>=1.30,<2",
    "networkx>=3.0",
    "playwright>=1.40",
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["suvari*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
